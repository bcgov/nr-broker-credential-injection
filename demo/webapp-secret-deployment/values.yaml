global:
  name: "knox-retriever-demo"
  namespace: "c2053d"
  short-env: "dev"
  environment: "development"

image:
  registry: "artifacts.developer.gov.bc.ca/github-docker-remote/"
  repository: "bcgov/nr-broker-credential-injection/demo-nest-app"
  tag: "12"
  pullPolicy: IfNotPresent

route:
  internal:
    enabled: true
    host: nestapp-dev.apps.silver.devops.gov.bc.ca

vault:
  secret: "vault-secret"
  addr: "https://knox.io.nrs.gov.bc.ca"
  authPath: "auth/vs_apps_approle"
  secretPath: "apps/dev/oscar-example/nodejs-sample/proxy-account-ready-only"
  approle:
    roleKey: "role"
    secretIdKey: "secret_id"

app:
  version: "1.0.1"