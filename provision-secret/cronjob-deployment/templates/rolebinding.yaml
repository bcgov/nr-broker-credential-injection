{{- if and .Values.rbac.create .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cronjob-deployment.fullname" . }}
  labels:
    {{- include "cronjob-deployment.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cronjob-deployment.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cronjob-deployment.fullname" . }}
{{- end }}