name: Publish Helm Chart to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Space-separated list of chart directories to package and publish.
  # Each path is relative to the repository root.
  HELM_CHARTS: "provision-secret/cronjob-deployment knox-tools-sync"
  GH_PAGES_BRANCH: gh-pages
  IGNORED_TAGS: "v1.0.0 v1.0.1 v2.0.0"

jobs:
  publish-helm-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get all v tags
        id: tags
        run: |
          tags=$(git tag -l 'v*' | sort -V)
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$tags" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Found tags:"
          echo "$tags"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Package all versions
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/charts"
          charts="${{ env.HELM_CHARTS }}"
          echo "${{ steps.tags.outputs.tags }}" | while read -r tag; do
            if [ -z "$tag" ]; then continue; fi
            # Skip ignored tags
            case "${{ env.IGNORED_TAGS }}" in
              *"$tag"*) echo "Skipping ignored tag: $tag"; continue ;;
            esac
            echo "=== Packaging $tag ==="
            git checkout "$tag"
            for dir in $charts; do
              if [ -f "$dir/Chart.yaml" ]; then
                (
                  cd "$dir"
                  helm package --version "${tag#v}" .
                  mv *.tgz "${GITHUB_WORKSPACE}/charts/"
                )
              else
                echo "Chart $dir not present in $tag; skipping"
              fi
            done
          done
          echo "=== Packaging main ==="
          git checkout main
          for dir in $charts; do
            (
              cd "$dir"
              helm package --version 0.0.1-main .
              mv *.tgz "${GITHUB_WORKSPACE}/charts/"
            )
          done
          echo "Packaged charts:"
          ls -la "${GITHUB_WORKSPACE}/charts/"

      - name: Generate index.yaml
        run: |
          cd charts
          helm repo index . \
            --url https://bcgov.github.io/nr-broker-credential-injection \
             --merge index.yaml || true
          cat index.yaml

      - name: Generate index.html
        run: |
          cat > charts/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Helm Charts Repository</title>
          </head>
          <body>
              <h1>Helm Charts Repository</h1>
              <p>This is a Helm chart repository. Add with <code>helm repo add</code></p>
              <ul>
                <li><a href="index.yaml">index.yaml</a></li>
              </ul>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Docs
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the charts folder
          path: './charts'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Chart Repository URL
        run: |
          echo "Helm chart repository URL: https://bcgov.github.io/nr-broker-credential-injection/"
