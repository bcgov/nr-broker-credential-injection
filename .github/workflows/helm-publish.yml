name: Publish Helm Chart to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'provision-secret/cronjob-deployment/**'
      - 'provision-secret/cronjob-deployment/Chart.yaml'
      - 'provision-secret/cronjob-deployment/values.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_CHART_DIR: provision-secret/cronjob-deployment
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  publish-helm-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Package Helm Chart
        run: |
          cd ${{ env.HELM_CHART_DIR }}
          helm package .
          mkdir -p ../charts
          mv *.tgz ../charts/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Helm Chart to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./charts

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

      - name: Chart Repository URL
        run: |
          echo "Helm chart repository URL: https://bcgov.github.io/nr-broker-credential-injection/"
