name: Publish Helm Chart to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'provision-secret/cronjob-deployment/**'
      - 'provision-secret/cronjob-deployment/Chart.yaml'
      - 'provision-secret/cronjob-deployment/values.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_CHART_DIR: provision-secret/cronjob-deployment
  GH_PAGES_BRANCH: gh-pages
  CHART_NAME: cronjob-deployment

jobs:
  publish-helm-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get all v tags
        id: tags
        run: |
          tags=$(git tag -l 'v*' | sort -V)
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$tags" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Found tags:"
          echo "$tags"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Package all versions
        run: |
          mkdir -p charts
          cd ${{ env.HELM_CHART_DIR }}
          echo "${{ steps.tags.outputs.tags }}" | while read -r tag; do
            if [ -z "$tag" ]; then continue; fi
            echo "=== Packaging $tag ==="
            (
              git checkout "$tag"
              helm package --version "${tag#v}" .
              mv *.tgz ../../charts/
            )
          done
          echo "=== Packaging main ==="
          git checkout main
          helm package --version 0.0.1-main .
          mv *.tgz ../../charts/
          echo "Packaged charts:"
          ls -la charts/

      - name: Generate index.yaml
        run: |
          cd charts
          helm repo index . \
            --url https://bcgov.github.io/nr-broker-credential-injection \
            --merge index.yaml || true
          cat index.yaml

      - name: Checkout gh-pages branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.GH_PAGES_BRANCH }}
          path: gh-pages
          fetch-depth: 1

      - name: Deploy to gh-pages
        run: |
          cd gh-pages
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          rm -rf *
          cp -r ../charts/* .
          git add -A
          git commit -m "Publish helm charts $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push -f origin gh-pages

      - name: Chart Repository URL
        run: |
          echo "Helm chart repository URL: https://bcgov.github.io/nr-broker-credential-injection/"
