{{- if and .Values.rbac.create .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "knox-tools-sync.fullname" . }}
  labels:
      {{- include "knox-tools-sync.labels" . | nindent 4 }}
subjects:
    - kind: ServiceAccount
      name: {{ include "knox-tools-sync.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "knox-tools-sync.fullname" . }}
{{- end }}
