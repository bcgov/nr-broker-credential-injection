{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "knox-tools-sync.fullname" . }}
  labels:
      {{- include "knox-tools-sync.labels" . | nindent 4 }}
rules:
     - apiGroups: [""]
       resources: ["secrets"]
       verbs: {{ .Values.rbac.verbs | toJson }}
{{- end }}
